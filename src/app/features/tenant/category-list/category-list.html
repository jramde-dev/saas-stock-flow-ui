<p-toast position="top-right" />
@if (categories.length > 0) {
  <div class="mb-4 p-4 pt-0">
    <div class="flex align-items-center justify-content-between mt-4">
      <h1 class="text-2xl font-bold">Categories</h1>
      <div>
        <p-button label="Add category" icon="pi pi-plus" (onClick)="addCategory()" />
      </div>
    </div>
    <p-panel>
      <div>
        <div class="card">
          <p-table [value]="categories" showGridlines [tableStyle]="{ 'min-width': '50rem' }">
            <ng-template #header>
              <tr>
                <th>Name</th>
                <th>Description</th>
                <th>Actions</th>
              </tr>
            </ng-template>
            <ng-template #body let-category>
              <tr>
                <td>{{ category.name }}</td>
                <td>{{ category.description }}</td>
                <td>
                  <div class="flex justify-content-center gap-2">
                    <i (click)="onEditCategory(category.id)" class="cursor-pointer pi pi-pencil"
                       style="color: green" pTooltip="Edit"
                       tooltipPosition="top"></i>
                    <i (click)="onDeleteCategory()" class="cursor-pointer pi pi-trash"
                       style="color: red" pTooltip="Delete"
                       tooltipPosition="top"></i>
                  </div>
                </td>
              </tr>
            </ng-template>
          </p-table>
        </div>
      </div>
    </p-panel>
  </div>
} @else {
  <div>
    <p class="flex justify-content-center">No category found</p>
  </div>
}
