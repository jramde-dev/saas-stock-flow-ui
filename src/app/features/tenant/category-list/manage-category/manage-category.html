<div class="manage-wrapper">

  <div class="manage-header">
    <div class="page-icon icon-purple"><i class="pi pi-tag"></i></div>
    <div>
      <h2>{{ categoryId ? 'Edit Category' : 'New Category' }}</h2>
      <p>{{ categoryId ? 'Update category details' : 'Create a new product category' }}</p>
    </div>
  </div>

  <div class="manage-card">
    <div class="form-fields">
      <div class="form-field">
        <p-floatlabel variant="on">
          <input pInputText id="name" name="name" [(ngModel)]="categoryRequest.name"
                 autocomplete="off" class="full-width-input" />
          <label for="name">Category Name</label>
        </p-floatlabel>
        @if (hasError('name')) {
          <small class="field-error">{{ getErrorMsg('name') }}</small>
        }
      </div>
      <div class="form-field">
        <p-floatlabel variant="on">
          <input pInputText id="description" name="description"
                 [(ngModel)]="categoryRequest.description"
                 autocomplete="off" class="full-width-input" />
          <label for="description">Description <span style="color:#94a3b8">(optional)</span></label>
        </p-floatlabel>
        @if (hasError('description')) {
          <small class="field-error">{{ getErrorMsg('description') }}</small>
        }
      </div>
    </div>

    <div class="form-actions">
      <p-button [label]="categoryId ? 'Update Category' : 'Create Category'" icon="pi pi-check"
                (onClick)="onAddCategory()" />
      <p-button label="Cancel" variant="outlined" severity="secondary" (onClick)="backToCategories()" />
    </div>
  </div>

</div>
