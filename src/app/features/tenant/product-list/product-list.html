<p-toast position="top-right" />
@if (products.length > 0) {
  <div class="flex align-items-center justify-content-between mt-4">
    <h1 class="text-2xl font-bold">Products List</h1>
    <div>
      <p-button label="Add product" icon="pi pi-plus" (onClick)="onAddProduct()" />
    </div>
  </div>
  <div class="mb-4 p-4 pt-0">
    <p-panel>
      <div>
        <p-table [value]="products" showGridlines [tableStyle]="{ 'min-width': '50rem' }">
          <ng-template #header>
            <tr>
              <th>Category</th>
              <th>Product name</th>
              <th>Description</th>
              <th>Price</th>
              <th>Quantity</th>
              <th>Reference</th>
              <th>Actions</th>
            </tr>
          </ng-template>
          <ng-template #body let-product>
            <tr>
              <td>{{ product.categoryName }}</td>
              <td>{{ product.name }}</td>
              <td>{{ product.description }}</td>
              <td>{{ product.price }}</td>
              <td>{{ product.availableQuantity }}</td>
              <td>{{ product.reference }}</td>
              <td>
                <div class="flex justify-content-center gap-2">
                  <i (click)="onEditProduct(product.id)" class="cursor-pointer pi pi-pencil"
                     style="color: green" pTooltip="Edit"
                     tooltipPosition="top"></i>
                  <i (click)="onDeleteProduct(product.id)" class="cursor-pointer pi pi-trash"
                     style="color: red" pTooltip="Delete"
                     tooltipPosition="top"></i>
                </div>
              </td>
            </tr>
          </ng-template>
        </p-table>
      </div>
    </p-panel>
  </div>
} @else {
  <div class="flex justify-content-center flex-column align-items-center mt-8">
    <p>No product found</p>
    <p-button label="Create your first product" icon="pi pi-plus" (onClick)="onAddProduct()" />
  </div>
}
