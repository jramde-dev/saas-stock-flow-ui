<p-toast position="top-right" />
@if (users.length > 0) {
  <div class="flex align-items-center justify-content-between mt-4">
    <h1 class="text-2xl font-bold">Users List</h1>
    <div>
      <p-button (onClick)="onAddUser()" icon="pi pi-plus" label="Add user" />
    </div>
  </div>
  <div class="mb-4">
    <p-table [tableStyle]="{ 'min-width': '50rem' }" [value]="users" showGridlines>
      <ng-template #header>
        <tr>
          <th>E-mail</th>
          <th>First name</th>
          <th>Last name</th>
          <th>Role</th>
          <th>Username</th>
          <th>Actions</th>
        </tr>
      </ng-template>
      <ng-template #body let-user>
        <tr>
          <td>{{ user.email }}</td>
          <td>{{ user.firstName }}</td>
          <td>{{ user.lastName }}</td>
          <td>{{ user.role }}</td>
          <td>{{ user.username }}</td>
          <td>
            <div class="flex justify-content-center gap-2">
              <i (click)="onEditUser(user.id)" class="cursor-pointer pi pi-pencil"
                 pTooltip="Edit" style="color: green"
                 tooltipPosition="top"></i>
              <i (click)="onDeleteUser(user.id)" class="cursor-pointer pi pi-trash"
                 pTooltip="Delete" style="color: red"
                 tooltipPosition="top"></i>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
} @else {
  <div class="flex justify-content-center flex-column align-items-center mt-8">
    <p>No user found</p>
    <p-button (onClick)="onAddUser()" icon="pi pi-plus" label="Create your first user" />
  </div>
}
