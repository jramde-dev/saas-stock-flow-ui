<p-toast position="top-right" />
@if (tenants.length > 0) {
   <div>
      <h1 class="flex justify-content-center">Tenants List</h1>
      <div class="card">
         <p-table [value]="tenants" [tableStyle]="{ 'min-width': '50rem' }">
            <ng-template #header>
               <tr>
                  <th>Company Name</th>
                  <th>Company Code</th>
                  <th>Administrator</th>
                  <th>Admin e-mail</th>
                  <th>Admin Username</th>
                  <th><i class="pi pi-cog" style="font-size: 1.5rem"></i></th>
               </tr>
            </ng-template>
            <ng-template #body let-tenant>
               <tr>
                  <td>{{ tenant.companyName }}</td>
                  <td>{{ tenant.companyCode }}</td>
                  <td>{{ tenant.adminFirstName }} {{ tenant.adminLastName }}</td>
                  <td>{{ tenant.adminEmail }}</td>
                  <td>{{ tenant.adminUsername }}</td>
               </tr>
            </ng-template>
         </p-table>
      </div>
   </div>
} @else {
   <div>
      <p class="flex justify-content-center">No tenant found</p>
   </div>
}
